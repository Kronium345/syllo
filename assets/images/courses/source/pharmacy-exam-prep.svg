<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Pharmacy Exam Prep cover (drawn for Syllo; rendered to ../pharmacy-exam-prep.jpg at 800x450). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E4A"/>
      <stop offset="0.55" stop-color="#123A7A"/>
      <stop offset="1" stop-color="#0E6B6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2410C"/>
      <stop offset="0.45" stop-color="#F97316"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- Background and soft, out-of-focus lights (like the other covers' bokeh). -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="210" cy="170" r="150" fill="url(#glow)"/>
    <circle cx="1420" cy="140" r="190" fill="url(#glowTeal)"/>
    <circle cx="1330" cy="760" r="170" fill="url(#glow)"/>
    <circle cx="140" cy="760" r="120" fill="url(#glowTeal)"/>
    <circle cx="820" cy="80" r="90" fill="url(#glow)"/>
  </g>
  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="420" cy="620" r="60"/>
    <circle cx="1180" cy="300" r="40"/>
    <circle cx="980" cy="820" r="70"/>
  </g>

  <!-- Exam checklist (clipboard) on the left. -->
  <g transform="translate(250 230) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="430" rx="28" fill="#1E293B"/>
    <rect x="22" y="40" width="286" height="370" rx="14" fill="url(#paper)"/>
    <rect x="105" y="-18" width="120" height="52" rx="16" fill="#64748B"/>
    <rect x="125" y="-4" width="80" height="24" rx="10" fill="#334155"/>
    <!-- three ticked rows and one open -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <rect x="52" y="86" width="44" height="44" rx="10" fill="#DCFCE7"/>
      <path d="M62 108 l10 10 l18 -22" stroke="#16A34A" stroke-width="7" fill="none"/>
      <rect x="114" y="98" width="160" height="14" rx="7" fill="#94A3B8"/>
      <rect x="52" y="166" width="44" height="44" rx="10" fill="#DCFCE7"/>
      <path d="M62 188 l10 10 l18 -22" stroke="#16A34A" stroke-width="7" fill="none"/>
      <rect x="114" y="178" width="130" height="14" rx="7" fill="#94A3B8"/>
      <rect x="52" y="246" width="44" height="44" rx="10" fill="#DCFCE7"/>
      <path d="M62 268 l10 10 l18 -22" stroke="#16A34A" stroke-width="7" fill="none"/>
      <rect x="114" y="258" width="150" height="14" rx="7" fill="#94A3B8"/>
      <rect x="52" y="326" width="44" height="44" rx="10" fill="none" stroke="#94A3B8" stroke-width="5"/>
      <rect x="114" y="338" width="110" height="14" rx="7" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- Prescription bottle in the middle. -->
  <g transform="translate(690 200)" filter="url(#shadow)">
    <rect x="10" y="0" width="200" height="74" rx="16" fill="url(#cap)"/>
    <g stroke="#94A3B8" stroke-width="5" opacity="0.6">
      <line x1="40" y1="14" x2="40" y2="60"/><line x1="70" y1="14" x2="70" y2="60"/>
      <line x1="100" y1="14" x2="100" y2="60"/><line x1="130" y1="14" x2="130" y2="60"/>
      <line x1="160" y1="14" x2="160" y2="60"/><line x1="190" y1="14" x2="190" y2="60"/>
    </g>
    <rect x="0" y="66" width="220" height="400" rx="34" fill="url(#bottle)" opacity="0.95"/>
    <rect x="22" y="80" width="26" height="360" rx="13" fill="#FFFFFF" opacity="0.18"/>
    <!-- label with a green cross -->
    <rect x="24" y="170" width="172" height="190" rx="16" fill="#F8FAFC"/>
    <path d="M90 205 h40 v34 h34 v40 h-34 v34 h-40 v-34 h-34 v-40 h34 z" fill="#16A34A"/>
    <rect x="52" y="330" width="116" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- Blister pack, tilted, on the right. -->
  <g transform="translate(1040 300) rotate(12)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="230" rx="26" fill="url(#foil)"/>
    <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4">
      <rect x="34" y="34" width="70" height="70" rx="35"/>
      <rect x="130" y="34" width="70" height="70" rx="35"/>
      <rect x="226" y="34" width="70" height="70" rx="35"/>
      <rect x="34" y="128" width="70" height="70" rx="35"/>
      <rect x="130" y="128" width="70" height="70" rx="35"/>
    </g>
    <!-- one empty, pressed-out pocket -->
    <rect x="226" y="128" width="70" height="70" rx="35" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4" stroke-dasharray="10 8"/>
    <g fill="#3B82F6">
      <circle cx="69" cy="69" r="24"/><circle cx="165" cy="69" r="24"/><circle cx="261" cy="69" r="24"/>
      <circle cx="69" cy="163" r="24"/><circle cx="165" cy="163" r="24"/>
    </g>
    <g fill="#FFFFFF" opacity="0.45">
      <circle cx="61" cy="60" r="7"/><circle cx="157" cy="60" r="7"/><circle cx="253" cy="60" r="7"/>
      <circle cx="61" cy="154" r="7"/><circle cx="157" cy="154" r="7"/>
    </g>
  </g>

  <!-- Loose capsules in the foreground. -->
  <g filter="url(#shadow)">
    <g transform="translate(980 640) rotate(-28)">
      <rect x="0" y="0" width="170" height="64" rx="32" fill="#F8FAFC"/>
      <path d="M85 0 h53 a32 32 0 0 1 0 64 h-53 z" fill="#EF4444"/>
      <rect x="18" y="12" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.5"/>
    </g>
    <g transform="translate(1200 690) rotate(18)">
      <rect x="0" y="0" width="150" height="58" rx="29" fill="#F8FAFC"/>
      <path d="M75 0 h46 a29 29 0 0 1 0 58 h-46 z" fill="#14B8A6"/>
      <rect x="16" y="10" width="104" height="9" rx="4.5" fill="#FFFFFF" opacity="0.5"/>
    </g>
    <circle cx="640" cy="760" r="34" fill="#F8FAFC"/>
    <rect x="612" y="756" width="56" height="8" rx="4" fill="#CBD5E1"/>
    <circle cx="560" cy="700" r="26" fill="#FDE68A"/>
  </g>
</svg>
